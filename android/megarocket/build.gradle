plugins {
    id 'com.android.application'
}

android {
    namespace = "com.megarocket"
    compileSdkVersion 35
    ndkVersion "29.0.14206865"
    defaultConfig {
        applicationId "com.megarocket"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "0.9.1"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static", "-DRENDERER=sdl2"
                targets "SDL2", "megarocket_launcher", "omnispeak", "keen13", "keen13_ep2", "keen13_ep3"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    lint {
        abortOnError = false
    }
    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/omniassets"
        }
    }
}

/* Bundle Omnispeak's own public metadata (the same files the desktop dist
 * places in rt/ by constructive copy) so the APK is self-sufficient; the
 * launcher extracts them to files/rt on first run.  Copied from the
 * junctioned engine tree at build time -- nothing new is committed. */
task copyOmniAssets(type: Copy) {
    from 'jni/omnispeak/data/keen4'
    from 'jni/omnispeak/data/keen5'
    from 'jni/omnispeak/data/keen6e14'
    into "$buildDir/generated/omniassets/rt"
}
preBuild.dependsOn copyOmniAssets

dependencies {
    implementation "androidx.documentfile:documentfile:1.0.1"
}
